{% extends "base.html" %}
{% block title %}Delete job{% endblock %}
{% block content %}
<div class="container-narrow form-card">
  <div class="panel">
    <h1>Delete this job?</h1>
    <p>You are about to delete <strong>{{ job.title }}</strong> at {{ job.company_name }}. All applications to it will be deleted too. This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <button type="submit" class="btn btn-danger">Delete job</button>
        <a class="btn btn-outline" href="{% url 'job_detail' job.pk %}">Keep job</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
